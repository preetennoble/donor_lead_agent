<style>
        .glass-card {
            background: rgba(26, 29, 46, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(79, 82, 105, 0.4);
            box-shadow: 0px 20px 40px rgba(99, 102, 241, 0.1);
        }
        
        .bg-radial-gradient {
            background: radial-gradient(circle at 50% -20%, rgba(87, 27, 193, 0.15) 0%, rgba(15, 17, 23, 1) 50%);
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            background: #0F1117;
            border: 1px solid #2E3245;
            color: #e2e2eb;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #c0c1ff;
            box-shadow: 0 0 0 1px #c0c1ff;
            outline: none;
        }

        .input-group label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #908fa0;
            pointer-events: none;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            left: 12px;
            font-size: 10px;
            padding: 0 4px;
            background: #0F1117;
            color: #c0c1ff;
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, #571bc1, #8083ff);
            transition: all 0.3s ease;
        }
        
        .shimmer-btn:hover {
            box-shadow: 0 0 20px rgba(128, 131, 255, 0.4);
        }

        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }
    </style>

</div>
<!-- Glassmorphism Card -->
<div class="glass-card rounded-xl p-8 w-full relative overflow-hidden">
<!-- Decorative corner glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container rounded-full blur-[60px] opacity-20 pointer-events-none"></div>
<div class="text-center mb-stack-lg relative z-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Welcome back to DonorIQ</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">The Intelligence Layer for Donor Research</p>
</div>
<form class="space-y-stack-md relative z-10">
<div class="input-group">
<input class="w-full px-4 py-3 rounded-lg font-body-sm text-body-sm" id="username" placeholder=" " required="" type="text"/>
<label class="font-body-sm" for="username">Username</label>
</div>
<div class="input-group">
<input class="w-full px-4 py-3 rounded-lg font-body-sm text-body-sm" id="password" placeholder=" " required="" type="password"/>
<label class="font-body-sm" for="password">Password</label>
</div>
<div class="flex items-center justify-between mt-unit mb-stack-lg">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant bg-surface text-primary focus:ring-primary focus:ring-offset-background" id="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm font-medium text-primary hover:text-primary-fixed-dim transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<button class="shimmer-btn w-full flex justify-center py-3 px-4 rounded-lg text-white font-label-md text-label-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Footer -->
<div class="text-center mt-stack-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New to DonorIQ? <a class="text-primary hover:text-primary-fixed-dim transition-colors font-medium" href="#">Contact your administrator.</a>
</p>
</div>
