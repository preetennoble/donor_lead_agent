<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f1115; color: #e5e7eb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #171a21; padding: 2.5rem; border-radius: 12px; width: 320px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #9ca3af; }
        input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #2d313c; background: #0f1115; color: #e5e7eb; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; border: none; border-radius: 6px; background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
        .error { color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <form class="box" method="POST" action="/change-password">
        <h1>Set a new password</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label>New password</label>
        <input type="password" name="new_password" required minlength="8">
        <label>Confirm password</label>
        <input type="password" name="confirm_password" required minlength="8">
        <button type="submit">Update password</button>
    </form>
</body>
</html>
