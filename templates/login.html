<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Donor Partner Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f1115; color: #e5e7eb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { background: #171a21; padding: 2.5rem; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #9ca3af; }
        input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #2d313c; background: #0f1115; color: #e5e7eb; box-sizing: border-box; }
        button.submit { width: 100%; padding: 0.7rem; border: none; border-radius: 6px; background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
        .error { color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; }
        .toggle-group { display: flex; margin-bottom: 1.2rem; border: 1px solid #2d313c; border-radius: 8px; overflow: hidden; }
        .toggle-btn { flex: 1; padding: 0.5rem; background: #0f1115; color: #9ca3af; border: none; cursor: pointer; font-size: 0.85rem; }
        .toggle-btn.active { background: #4f46e5; color: white; }
    </style>
</head>
<body>
    <form class="login-box" method="POST" action="/login">
        <h1>Sign in</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <div class="toggle-group">
            <button type="button" class="toggle-btn{% if login_as != 'user' %} active{% endif %}" data-value="admin" onclick="selectRole(this)">Admin</button>
            <button type="button" class="toggle-btn{% if login_as == 'user' %} active{% endif %}" data-value="user" onclick="selectRole(this)">Employee</button>
        </div>
        <input type="hidden" name="login_as" id="login_as" value="{{ login_as or 'admin' }}">

        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
        <button type="submit" class="submit">Login</button>
    </form>

    <script>
        function selectRole(btn) {
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('login_as').value = btn.dataset.value;
        }
    </script>
</body>
</html>
